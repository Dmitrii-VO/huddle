<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huddle</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="stage">
    <div id="status" class="pill">Подключение…</div>

    <div id="screen-wrap" hidden>
      <video id="screen" autoplay playsinline muted></video>
      <canvas id="ink"></canvas>
      <input id="text-input" hidden maxlength="200" placeholder="Текст и Enter">
      <div id="anno" class="bar">
        <button data-tool="control" id="mouse" title="Управление мышью ученика">
          <svg viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg><span>Управление</span></button>
        <button data-tool="pointer" title="Указка">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg><span>Указка</span></button>
        <button data-tool="pen" title="Рисовать">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>Рисовать</span></button>
        <button data-tool="arrow" title="Стрелка">
          <svg viewBox="0 0 24 24"><path d="M5 19 19 5M9 5h10v10"/></svg><span>Стрелка</span></button>
        <button data-tool="text" title="Текст">
          <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg><span>Текст</span></button>
        <button data-tool="eraser" title="Ластик: нажмите на пометку">
          <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21"/><path d="M22 21H7M5 11l9 9"/></svg><span>Ластик</span></button>
        <div id="colors"></div>
        <button id="undo" title="Отменить">
          <svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg><span>Отменить</span></button>
        <button id="clear" title="Стереть всё">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg><span>Очистить</span></button>
      </div>
    </div>

    <div id="tiles">
      <div class="tile nocam" id="remote-tile">
        <video id="remote" autoplay playsinline></video>
        <div class="placeholder">Собеседник</div>
        <span class="name"><svg class="muted" viewBox="0 0 24 24" hidden><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>Собеседник</span>
      </div>
      <div class="tile nocam" id="local-tile">
        <video id="local" autoplay playsinline muted></video>
        <div class="placeholder">Вы</div>
        <span class="name">Вы</span>
        <button id="hide-self" title="Скрыть себя">×</button>
      </div>
    </div>
    <button id="show-self" class="pill" hidden>Показать себя</button>

    <div id="sharing" class="pill" hidden>Вы демонстрируете экран <button id="stop-share">Остановить</button></div>
  </main>

  <aside id="chat" hidden>
    <header>Чат <button id="chat-close" title="Закрыть">×</button></header>
    <div id="messages"></div>
    <form id="chat-form"><input id="chat-input" placeholder="Сообщение…" autocomplete="off"></form>
  </aside>

  <footer id="toolbar">
    <div class="group">
      <button id="mic" class="tb">
        <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg>
        <span>Выкл. звук</span></button>
      <button id="cam" class="tb">
        <svg viewBox="0 0 24 24"><path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg>
        <span>Остановить видео</span></button>
      <button id="net" class="tb" title="Качество связи" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 20v-3M9 20v-7M14 20v-11M19 20V5"/></svg>
        <span>—</span></button>
    </div>
    <div class="group">
      <button id="copy" class="tb">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        <span>Пригласить</span></button>
      <button id="share" class="tb share">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4M9 10l3-3 3 3M12 7v7"/></svg>
        <span>Демонстрация</span></button>
      <button id="chat-toggle" class="tb">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Чат</span><i id="unread" hidden></i></button>
      <a id="get-app" class="tb" href="/download" target="_blank" hidden title="Демонстрация с рисованием и удалённое управление работают в приложении">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        <span>Приложение</span></a>
      <button id="release" class="tb danger" hidden>
        <svg viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><line x1="3" y1="21" x2="21" y2="3"/></svg>
        <span>Отключить управление</span></button>
    </div>
    <div class="group">
      <button id="view" class="tb">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Галерея</span></button>
      <button id="fullscreen" class="tb">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <span>Во весь экран</span></button>
      <button id="leave" class="leave">Выйти</button>
    </div>
  </footer>

  <div id="toast" hidden></div>
  <a id="old-app" href="/download" target="_blank" hidden>Приложение устарело — некоторые функции не работают. Скачайте новую версию →</a>

  <script src="/app.js" type="module"></script>
</body>
</html>
