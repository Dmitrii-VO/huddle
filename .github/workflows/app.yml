name: App release
# Push a tag vX.Y.Z (sh deploy/release-app.sh X.Y.Z) -> draft release -> both builds upload -> publish.
# Publishing last means "latest" never points at a release without files; the app's updater reads "latest".
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match app/package.json version
        run: test "v$(node -p "require('./app/package.json').version")" = "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "Huddle $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: draft
    strategy:
      matrix:
        include:
          - os: macos-latest
            cmd: npx electron-builder --mac dmg zip --universal # zip: what the app updates itself from
          - os: windows-latest
            cmd: npx electron-builder --win nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Universal mac build needs koffi's native binary for both archs; npm only installs the runner's.
      - if: runner.os == 'macOS'
        run: npm install --no-save --force @koromix/koffi-darwin-x64@3.3.5 @koromix/koffi-darwin-arm64@3.3.5
      # Mac: signed with our own self-signed certificate (deploy/mac-signing.pem; the key is in the secrets). Not Apple's,
      # so a manual install still gets Gatekeeper's warning, but the signature stays the same from version to version
      # and macOS keeps the permissions (screen recording, PowerPoint, accessibility) across updates.
      # Trusted on the runner so codesign accepts it as an identity.
      - if: runner.os == 'macOS'
        run: sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain ../deploy/mac-signing.pem
      - run: ${{ matrix.cmd }} --publish never
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }} # Windows: unsigned
      - if: runner.os == 'macOS'
        run: codesign --verify --deep --strict dist/mac-universal/Huddle.app && codesign -d -r- dist/mac-universal/Huddle.app
      # latest.yml + .blockmap are what the Windows updater reads.
      - run: shopt -s nullglob; gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap dist/latest*.yml --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
