name: Student app
on: workflow_dispatch
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            cmd: npx electron-builder --mac dmg --universal
          - os: windows-latest
            cmd: npx electron-builder --win portable
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Universal mac build needs koffi's native binary for both archs; npm only installs the runner's.
      - if: runner.os == 'macOS'
        run: npm install --no-save --force @koromix/koffi-darwin-x64@3.3.5 @koromix/koffi-darwin-arm64@3.3.5
      - run: ${{ matrix.cmd }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # unsigned build
      # Releases, not artifacts: the account's artifact storage quota is shared and full.
      - run: shopt -s nullglob; gh release upload app-latest dist/*.dmg dist/*.exe --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
