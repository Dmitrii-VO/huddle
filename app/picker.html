<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; background: #1c1c1c; color: #eee; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
    body { display: flex; flex-direction: column; border: 1px solid #333; box-sizing: border-box; }
    header { padding: 18px 22px 6px; -webkit-app-region: drag; }
    h1 { margin: 0; font-size: 17px; font-weight: 600; }
    #hint { margin: 4px 0 0; color: #aaa; }
    main { flex: 1; overflow-y: auto; padding: 8px 22px; }
    h2 { margin: 14px 0 8px; font-size: 13px; font-weight: 600; color: #aaa; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .item { padding: 6px; border: 2px solid transparent; border-radius: 10px; background: #262626; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .item:hover { background: #303030; }
    .item.on { border-color: #0e71eb; }
    .item:focus-visible { outline: 2px solid #6fb3ff; outline-offset: 2px; }
    .item img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #111; border-radius: 6px; }
    .item span { display: block; margin-top: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 18px; }
    button.b { padding: 9px 18px; border: 0; border-radius: 8px; background: #2c2c2c; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
    button.b:hover { background: #383838; }
    button.primary { background: #0e71eb; color: #fff; }
    button.primary:hover { background: #0b5fc6; }
    button.primary:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header><h1>Что показать ученику</h1><p id="hint"></p></header>
  <main>
    <h2>Весь экран</h2><div class="grid" id="screens"></div>
    <h2>Окно — ученик увидит только его</h2><div class="grid" id="windows"></div>
  </main>
  <footer><button class="b" id="cancel">Отмена</button><button class="b primary" id="ok" disabled>Показать</button></footer>
  <script>
    const $ = (id) => document.getElementById(id);
    let chosen = -1;
    const answer = (i) => window.huddle.pickerAnswer(i);
    window.huddle.onPicker(({ hint, items }) => {
      $('hint').textContent = hint;
      const screens = items.filter((it) => it.screen).length;
      items.forEach((it, i) => {
        const b = document.createElement('button');
        b.className = 'item';
        const img = document.createElement('img');
        img.src = it.thumb;
        const name = document.createElement('span');
        name.textContent = it.screen ? (screens > 1 ? `Экран ${i + 1}` : 'Весь экран') : it.name;
        b.title = name.textContent;
        b.append(img, name);
        b.onclick = () => {
          chosen = i;
          for (const x of document.querySelectorAll('.item')) x.classList.toggle('on', x === b);
          $('ok').disabled = false;
        };
        b.ondblclick = () => answer(i);
        $(it.screen ? 'screens' : 'windows').append(b);
      });
      document.querySelector('.item')?.focus();
    });
    $('ok').onclick = () => chosen >= 0 && answer(chosen);
    $('cancel').onclick = () => answer(-1);
    addEventListener('keydown', (e) => {
      if (e.key === 'Escape') answer(-1);
      if (e.key === 'Enter' && chosen >= 0) answer(chosen);
    });
  </script>
</body>
</html>
